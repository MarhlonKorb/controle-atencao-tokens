<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tokens de Atenção</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <header class="topbar">

            <div>
                <h1>🎯 Controle de Tokens de Atenção</h1>

                <p class="small">
                    Último reset:
                    <strong id="lastResetLabel">-</strong>
                </p>
            </div>

        </header>

        <section class="controls">

            <input
                id="nome"
                type="text"
                placeholder="Nome da pessoa">

            <input
                id="limite"
                type="number"
                min="1"
                value="10"
                placeholder="Tokens">

            <button
                class="primary"
                onclick="addPerson()">

                ➕ Adicionar

            </button>

            <input
                id="search"
                type="text"
                placeholder="🔍 Pesquisar..."
                oninput="render()">

        </section>

        <!-- Os cards são criados dinamicamente pelo JavaScript -->
        <section id="list"></section>

        <footer class="footer">

            <button
                class="danger"
                onclick="resetDay()">

                🔄 Resetar Dia

            </button>

            <button
                class="success"
                onclick="sortByUsage()">

                📊 Ordenar por Consumo

            </button>

        </footer>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
